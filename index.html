<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tsunagu つなぐ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one calm app shell; role views swap in the main column. The older-adult view is a narrow, oversized column. */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#ECEAE4; --line:#D9D6CE;
  --ink:#22252C; --ink-2:#565A63; --indigo:#2D4878; --indigo-soft:#E3E8F2;
  --accent:#E3A33B; --accent-ink:#22252C; --accent-soft:#FBEBCD;
  --ok:#2F7A4F; --ok-soft:#DDF0E3; --warn:#9A5B00; --warn-soft:#FBE7C6; --bad:#A63A3A; --bad-soft:#F6DEDB;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:8px; --es:1;
  --chrome:rgb(255 255 255 / .74); --line-soft:rgb(34 37 44 / .08); --scrim:rgb(10 12 16 / .42);
  --toast:rgb(34 37 44 / .88); --toast-ink:#F4F3EF;
  --ease-spring:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171C; --surface:#1F2229; --surface-2:#282C34; --line:#363B45;
  --ink:#ECE9E2; --ink-2:#A9ADB6; --indigo:#9DB4E0; --indigo-soft:#253049;
  --accent:#EDB453; --accent-ink:#1A1B1F; --accent-soft:#3A2F1A;
  --ok:#7CCB98; --ok-soft:#1D3326; --warn:#E9B35E; --warn-soft:#3A2D16; --bad:#EE9A92; --bad-soft:#3D2120;
  --chrome:rgb(31 34 41 / .72); --line-soft:rgb(236 233 226 / .08); --scrim:rgb(0 0 0 / .55); --toast:rgb(236 233 226 / .9); --toast-ink:#15171C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171C; --surface:#1F2229; --surface-2:#282C34; --line:#363B45;
  --ink:#ECE9E2; --ink-2:#A9ADB6; --indigo:#9DB4E0; --indigo-soft:#253049;
  --accent:#EDB453; --accent-ink:#1A1B1F; --accent-soft:#3A2F1A;
  --ok:#7CCB98; --ok-soft:#1D3326; --warn:#E9B35E; --warn-soft:#3A2D16; --bad:#EE9A92; --bad-soft:#3D2120;
  --chrome:rgb(31 34 41 / .72); --line-soft:rgb(236 233 226 / .08); --scrim:rgb(0 0 0 / .55); --toast:rgb(236 233 226 / .9); --toast-ink:#15171C;
  color-scheme:dark}
*{box-sizing:border-box}
:root:lang(ja) body{letter-spacing:.02em}
:root:lang(en) .hero h1,:root:lang(en) .page-h h1,:root:lang(en) .elder h1,:root:lang(en) .wiz h1{letter-spacing:-.015em}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%)}

/* header: translucent material; content scrolls beneath, and a soft edge appears only once something is under it */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--chrome);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid transparent;transition:border-color .25s ease,box-shadow .25s ease}
body[data-scrolled] .top{border-bottom-color:var(--line-soft);box-shadow:0 10px 24px -18px rgb(0 0 0 / .35)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:.04em}
.brand span{font-size:13px;color:var(--ink-2)}
.demo-tag{font-size:13px;color:var(--ink-2);border-left:1px solid var(--line);padding-left:10px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.who strong{color:var(--ink);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;min-height:40px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--indigo);color:var(--surface)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
/* press feedback lands on pointer-down; release eases back like a settling spring */
.btn,.tile,.opt,.seg button,.tabs button,.linkish{transition:transform 280ms var(--ease-spring),background-color .15s,border-color .15s,color .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active:not([disabled]),.tile:active,.opt:active,.seg button:active{transform:scale(.97);transition-duration:70ms}
.btn:hover{border-color:var(--ink-2)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.04);border-color:var(--accent)}
.btn-ink{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
.btn-ink:hover{border-color:var(--indigo);filter:brightness(1.1)}
.btn-sm{min-height:40px;padding:6px 12px;font-size:14px;border-radius:6px}
.btn-quiet{border-color:transparent;background:none;color:var(--ink-2)}
.btn-quiet:hover{color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-ai{border-color:var(--indigo);color:var(--indigo)}
.linkish{background:none;border:0;padding:6px 0;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;min-height:40px;text-decoration:underline;text-underline-offset:3px}

/* generic */
main{padding-block:28px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.eyebrow{font-size:14px;color:var(--ink-2);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:1px 8px;border-radius:4px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ind{background:var(--indigo-soft);color:var(--indigo)}
.chip.acc{background:var(--accent-soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:48px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-size:12px;min-width:22px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink);line-height:22px;text-align:center}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:28px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:6px;background:var(--warn-soft);color:var(--ink);margin-bottom:16px}
.banner.info{background:var(--indigo-soft)}
.empty{padding:28px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r)}

/* landing */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;padding-block:12px 36px}
.hero h1{font-size:clamp(28px,4.2vw,44px);letter-spacing:.01em}
.hero p.lead{font-size:18px;color:var(--ink-2);margin-top:14px;max-width:34em}
.hero .row{margin-top:24px}
.hero .btn{min-height:56px;font-size:17px}
.kicker{font-size:14px;color:var(--ink-2)}
.hero h1 br{display:block}
/* the right column is a printed notice board: double rule on top, dotted lines between entries */
.board{background:var(--surface);border:1px solid var(--line);border-top:4px double var(--ink);padding:14px 18px 10px}
.board h2{font-size:17px;padding-bottom:8px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.board h2 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--ink-2)}
.board ol{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:minmax(3.2em,auto) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px dotted var(--line);align-items:baseline}
.board li:last-child{border-bottom:0}
.board time{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.15}
.board time small{display:block;font-size:12px;color:var(--ink-2);font-weight:500;font-family:var(--f-body)}
.board li b{display:block;font-weight:500;line-height:1.45}
.board li span{font-size:13px;color:var(--ink-2)}
.accts{border-top:1px solid var(--line);margin-top:14px}
.acct{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.acct b{display:block}
.acct > div:first-child span{font-size:14px;color:var(--ink-2)}
.acct .counts{font-size:14px;color:var(--ink-2)}
.acct .counts strong{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:720px){.acct{grid-template-columns:minmax(0,1fr) auto}.acct > div:first-child{grid-column:1/-1}}
.flow{display:grid;gap:10px}
.flow-step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.flow-step .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--indigo-soft);color:var(--indigo);font-weight:700}
.flow-step:nth-child(3) .n{background:var(--accent-soft);color:var(--ink)}
.flow-step b{display:block;font-weight:500}
.flow-step small{color:var(--ink-2);font-size:13px}
.sec-h{font-size:22px;margin-bottom:6px}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.role{display:flex;flex-direction:column;gap:10px}
.role h3{font-size:18px;display:flex;align-items:center;gap:8px}
.role p{font-size:14px;color:var(--ink-2);flex:1}
select.inp,input.inp,textarea.inp{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
textarea.inp{min-height:96px;resize:vertical}
.demo-path{display:grid;margin:16px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.dp{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dp .num{font-family:var(--f-display);font-size:22px;color:var(--indigo);width:28px;text-align:center}
.dp p{font-size:15px}
.dp small{display:block;color:var(--ink-2);font-size:13px}

/* elder view */
.elder{max-width:720px;margin:0 auto;font-size:calc(20px * var(--es))}
.elder h1{font-size:calc(30px * var(--es))}
.elder h2{font-size:calc(24px * var(--es));margin:36px 0 14px}
.e-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.tsize{display:flex;align-items:center;gap:8px;font-size:16px}
.tsize .seg button{min-height:48px;min-width:52px;font-weight:700}
.ecard{background:var(--surface);border:2px solid var(--line);border-radius:.45em;padding:1.1em;display:flex;flex-direction:column;gap:.7em;transition:opacity 220ms ease,transform 260ms cubic-bezier(.4,0,1,1)}
.ecard + .ecard{margin-top:.9em}
/* a chosen card drops toward "My upcoming events", where the new row lights up */
.ecard.leaving{opacity:0;transform:translateY(16px) scale(.98);pointer-events:none}
.up.fresh{animation:fresh 1.8s ease-out}
@keyframes fresh{from{background:var(--accent-soft);border-color:var(--accent)}}
.waiting.fresh{animation:appear 320ms var(--ease-spring)}
@keyframes appear{from{opacity:0;transform:scale(.96)}}
.ecat{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.8em;color:var(--ink-2)}
.ecard h3{font-size:1.35em}
.edl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;align-items:start}
.edl div{display:contents}
.edl dt{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.edl dd{margin:0;font-weight:500;min-width:0}
.why{border-top:1px dashed var(--line);padding-top:.6em;font-size:.92em}
.why strong{font-weight:700;margin-right:.3em}
.ebtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ebtns .btn{min-height:3.2em;font-size:1em;border-width:2px;border-radius:.35em}
.ebtns .btn-quiet{border-color:var(--line);color:var(--ink)}
.waiting{display:flex;align-items:center;justify-content:center;gap:10px;min-height:3.2em;border-radius:.35em;background:var(--indigo-soft);color:var(--indigo);font-weight:500;padding:8px 12px;text-align:center}
.up{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 18px;background:var(--surface);border:2px solid var(--line);border-radius:8px}
.up + .up{margin-top:12px}
.up .d{font-family:var(--f-display);font-weight:700;text-align:center;line-height:1.2;min-width:4.2em}
.up .d small{display:block;font-weight:500;font-size:.7em;color:var(--ink-2)}
.ai-mark{display:inline-block;font-size:max(12px,.65em);font-weight:700;letter-spacing:.04em;padding:0 5px;border:1px solid var(--indigo);color:var(--indigo);border-radius:3px;line-height:1.5;vertical-align:.1em}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px;padding:16px 10px 12px;justify-content:flex-start;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;font-weight:500;line-height:1.35}
/* interests are marked with one kanji in a stamp-like square, the way community-center timetables label activities */
.tile .em{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;width:46px;height:46px;display:grid;place-items:center;border:2px solid var(--indigo);color:var(--indigo);border-radius:4px}
.tile[aria-pressed="true"] .em{background:var(--indigo);color:var(--surface)}
.mark{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border:1.5px solid var(--indigo);color:var(--indigo);border-radius:3px;font-family:var(--f-display);font-weight:700;line-height:1;margin-right:.45em;vertical-align:-.25em}
.tile[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft);box-shadow:inset 0 0 0 1px var(--indigo)}
.tile[aria-pressed="true"]::after{content:"✓";font-weight:700;color:var(--indigo)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 16px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-size:18px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-2);flex:none}
.opt[aria-pressed="true"] .dot{border:7px solid var(--indigo)}
.mini-tiles .tile{min-height:72px;flex-direction:row;font-size:15px}
.mini-tiles .tile .em{font-size:16px;width:30px;height:30px;border-width:1.5px}

/* wizard */
.wiz{max-width:680px;margin:0 auto}
.wiz h1{font-size:30px;margin:8px 0 6px}
.wiz .q{font-size:19px;color:var(--ink-2);margin-bottom:22px}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog i.grow{animation:grow 420ms var(--ease-spring)}
@keyframes grow{from{width:var(--from)}}
/* steps move along one axis: Next arrives from the right, Back from the left */
.wiz-step.from-next{animation:in-next 340ms var(--ease-spring)}
.wiz-step.from-back{animation:in-back 340ms var(--ease-spring)}
@keyframes in-next{from{opacity:0;transform:translateX(28px)}}
@keyframes in-back{from{opacity:0;transform:translateX(-28px)}}
.wiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.wiz-nav .btn{min-height:60px;min-width:9em;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-weight:500}
.field .hint{font-size:13px;color:var(--ink-2)}
.wiz .inp{min-height:58px;font-size:19px}
.err{color:var(--bad);font-weight:500;margin-top:10px}
.consent{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;font-size:17px}
.consent ul{margin:8px 0 0;padding-left:1.2em}
.check{display:flex;gap:12px;align-items:center;margin-top:18px;font-size:18px;font-weight:500;cursor:pointer}
.check input{width:28px;height:28px;accent-color:var(--indigo)}

/* forms (organizer) */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fgrid .full{grid-column:1/-1}
.toggle{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--indigo)}

/* list rows */
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.lrow + .lrow{margin-top:10px}
.lrow h3{font-size:17px}
.lrow .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin-top:4px}
.lrow .meta span{display:inline-flex;gap:6px;align-items:center}
.lrow .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{font-variant-numeric:tabular-nums;font-weight:700}
details.att{margin-top:10px;font-size:14px}
details.att summary{cursor:pointer;color:var(--indigo);min-height:32px}
details.att ul{margin:6px 0 0;padding-left:1.2em}

/* family */
.fam-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px}
.pf dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:15px}
.pf dt{color:var(--ink-2)}
.pf dd{margin:0}
.rec{padding:14px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.rec:first-of-type{border-top:0}
.rec b{font-weight:500}
.rec .muted{font-size:14px}

/* modal + toast */
/* a modal task dims the page; it enters and leaves along the same path */
.scrim{position:fixed;inset:0;display:grid;place-items:center;z-index:20;padding:16px}
.scrim::before{content:"";position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 260ms ease}
.scrim.open::before{opacity:var(--dim,1)}

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

S = loadState() || seed();

/* ============ lookups ============ */
const elder = id => S.elders.find(e => e.id === id);
const helper = id => S.helpers.find(h => h.id === id);
const org = id => S.orgs.find(o => o.id === id);
const event = id => S.events.find(e => e.id === id);
const hasRsvp = (el, ev) => S.rsvps.some(r => r.elderId === el && r.eventId === ev);
const openReq = (el, ev) => S.callReqs.find(c => c.elderId === el && c.eventId === ev && c.status !== "done");
const surname = el => el.name.ja.split(" ")[0];
const nameOf = el => loc(el.name);
const san = el => S.lang === "ja" ? `${el.name.ja}さん` : el.name.en;

/* ============ recommendation engine ============ */
function scoreEvent(el, ev){
  if (ev.status !== "published") return null;
  const d = nextDate(ev);
  if (ev.when.kind !== "flex" && !d) return null;
  if (hasRsvp(el.id, ev.id)) return null;
  let s = 0; const why = [];
  const tags = new Set([ev.cat, ...ev.tags]);
  const hits = el.interests.filter(i => tags.has(i));
  if (hits.length){ s += 3*hits.length; why.push({k:"int", v:hits[0], w:3*hits.length}); }
  if (ev.area === "home"){ s += 1; why.push({k:"home", w:1}); }
  else {
    const k = km(el.area, ev.area), lim = {walk:1.2, bus:5, any:99}[el.travel];
    if (k > lim) return null;
    if (k <= 1.0){ s += 2; why.push({k:"walk", v:walkMin(k), w:2}); } else { s += 1; why.push({k:"bus", v:busMin(k), w:.9}); }
  }
  if (ev.when.kind !== "flex"){
    const slot = slotOf(ev.when.start), dow = d.getDay();
    const fit = el.times.includes(slot) && el.days.includes(dow === 0 || dow === 6 ? "wkend" : "wkday");
    if (fit){ s += 2; why.push({k:"time", v:slot, w:1.4}); } else s -= 2;
  }
  for (const a of el.access) s += ev.access.includes(a) ? 1 : -2;
  if (ev.helping && el.help !== "no"){ const b = el.help === "yes" ? 2 : 1; s += b; why.push({k:"help", w:b+.6}); }
  if (ev.crossGen && el.interests.includes("young")){ s += 1; why.push({k:"young", w:1.2}); }
  if (ev.firstTimer){ s += 1; why.push({k:"first", w:.8}); }
  s -= 2*(el.declined[ev.cat] || 0);
  why.sort((a,b) => b.w - a.w);
  return {ev, s, why, date:d};
}
function rankAll(el){ return S.events.map(e => scoreEvent(el, e)).filter(Boolean).sort((a,b) => b.s - a.s); }
function diversify(list, n){
  const out = [], cc = {};
  for (const r of list){ if (out.length >= n) break; if ((cc[r.ev.cat]||0) >= 2) continue; out.push(r); cc[r.ev.cat] = (cc[r.ev.cat]||0) + 1; }
  return out;
}
function picksFor(el, n=3){
  const ranked = rankAll(el);
  const ai = S.ai[el.id];
  if (ai){
    const out = [];
    for (const p of ai.picks){ const r = ranked.find(x => x.ev.id === p.id); if (r) out.push({...r, ai:p}); }
    for (const r of diversify(ranked, n+3)){ if (out.length >= n) break; if (!out.some(x => x.ev.id === r.ev.id)) out.push(r); }
    return out.slice(0, n);
  }
  return diversify(ranked, n);
}
function whyPart(w){
  switch (w.k){
    case "int": return J(`${INTERESTS[w.v].ja}がお好き`, `You like ${INTERESTS[w.v].en}`);
    case "walk": return J(`歩いて約${w.v}分`, `${w.v}-minute walk`);
    case "bus": return J(`バスで約${w.v}分`, `about ${w.v} minutes by bus`);
    case "home": return J("ご自宅から参加できます", "you can join from home");
    case "time": return J(`ご都合の良い${SLOTS[w.v].ja}です`, `fits your free ${SLOTS[w.v].en}s`);
    case "help": return J("人の役に立てる役割があります", "you can help others here");
    case "young": return J("若い世代と交流できます", "you'll meet younger people");
    case "first": return J("初めての方も歓迎", "beginners welcome");
  }
  return "";
}
function reasonText(r){
  if (r.ai) return S.lang === "ja" ? r.ai.ja : r.ai.en;
  const parts = r.why.slice(0,2).map(whyPart).filter(Boolean);
  if (!parts.length) return "";
  const t = parts.join(S.lang === "ja" ? " ・ " : " · ");
  return S.lang === "ja" ? t : t[0].toUpperCase() + t.slice(1);
}

/* ============ call scripts ============ */
function templateScript(el, ev){
  const r = scoreEvent(el, ev) || {why:[]};
  const sur = surname(el), surEn = el.name.en.split(" ").slice(-1)[0];
  const d = nextDate(ev), int = r.why.find(w => w.k === "int");

  const dEn = d ? `${d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})} at ${ev.when.start}` : "";
  const reasonJa = int ? `${INTERESTS[int.v].ja}がお好きと伺いましたので、ぴったりだと思いました。` : ev.helping ? "人の役に立てる役割があり、きっと喜ばれます。" : "初めての方も歓迎の、気軽な集まりです。";
  const reasonEn = int ? `We heard you enjoy ${INTERESTS[int.v].en}, so we thought of you.` : ev.helping ? "There's a role where you can help others, and people would really appreciate it." : "It's a relaxed gathering and newcomers are welcome.";
  const where = ev.area === "home" ? "" : ev.place.ja;
  const ja = ev.when.kind === "flex"
    ? `${sur}さん、こんにちは。「つなぐ」地域案内係です。今日は、${sur}さんに合いそうな催しのご案内でお電話しました。ご自宅から参加できる「${ev.title.ja}」があります。${reasonJa}参加費は${ev.cost?ev.cost+"円":"無料"}です。参加してみたいと思われますか？`
    : `${sur}さん、こんにちは。「つなぐ」地域案内係です。今日は、${sur}さんに合いそうな催しのご案内でお電話しました。${dJa}、${where}で「${ev.title.ja}」があります。${reasonJa}参加費は${ev.cost?ev.cost+"円":"無料"}です。行ってみたいと思われますか？`;
  const en = ev.when.kind === "flex"
    ? `Hello ${surEn}-san, this is the Tsunagu community guide. I'm calling about something we think you'd enjoy. "${ev.title.en}" is something you can take part in from home. ${reasonEn} It's ${ev.cost?"¥"+ev.cost:"free"}. Would you like to join?`
    : `Hello ${surEn}-san, this is the Tsunagu community guide. I'm calling about an event we think you'd enjoy. On ${dEn}, "${ev.title.en}" is happening at ${ev.place.en}. ${reasonEn} It's ${ev.cost?"¥"+ev.cost:"free"}. Would you like to go?`;
  return {ja, en, ai:false};
}
const scriptKey = (el, ev) => el + "|" + ev;
function getScript(elId, evId){ return S.scripts[scriptKey(elId, evId)] || templateScript(elder(elId), event(evId)); }

/* ============ AI layer (Claude via the artifact runtime) ============ */
function aiErr(e){
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled"){ AI = null; return J("AI機能はこの画面では使えません。ルールによるおすすめを表示しています。","AI isn't available in this view. Showing rule-based picks."); }
  if (c === "rate_limited") return J("AIが混み合っています。少し待ってからもう一度お試しください。","AI is busy. Wait a moment and try again.");
  if (c === "cancelled") return "";
  return J("AIの応答を読み取れませんでした。ルールによるおすすめはそのまま使えます。","Couldn't read the AI's answer. The rule-based picks still work.");
}
function profileForAI(el){
  return {
    interests: el.interests.map(i => INTERESTS[i].en),
    neighborhood: AREAS[el.area].en, travel: el.travel, available: {days: el.days, times: el.times},
    accessibility_needs: el.access, wants_to_help_others: el.help,
    recently_declined_categories: Object.keys(el.declined).filter(k => el.declined[k] > 0)
  };
}
async function aiRecommend(elId){
  const el = elder(elId); if (!AI || !el) return;
  const cands = rankAll(el).slice(0, 8).map(r => ({
    id:r.ev.id, title_en:r.ev.title.en, title_ja:r.ev.title.ja, category:r.ev.cat, tags:r.ev.tags,
    when:r.ev.when.kind === "flex" ? "anytime, from home" : `${r.date.toDateString()} ${r.ev.when.start}`,
    getting_there: routeLabelEn(el, r.ev), helping_role:r.ev.helping, cross_generational:r.ev.crossGen, beginner_friendly:r.ev.firstTimer, cost_yen:r.ev.cost, rule_score:r.s
  }));
  if (!cands.length) return toast(J("条件に合う催しがありません","No matching events right now"));
  UI.busy["ai-"+elId] = true; render();
  const prompt = `You help an older adult in Kyoto, Japan find local community events so they feel less isolated. This is not a health service.
Pick the 3 events from CANDIDATES that best suit this person. Prefer things matching their interests, close by, at times they're free, and (if they want to) where they can help others. Do not pick 3 of the same category. Gently favour beginner-friendly events.
For each pick write one short, warm reason addressed to the person: reason_ja in plain polite Japanese (max 35 characters, no jargon) and reason_en in plain English (max 14 words).
Reply with only a JSON array like: [{"id":"e2","reason_ja":"編み物がお好きで、歩いてすぐです","reason_en":"You love knitting, and it's a short walk away"}]

PERSON: ${JSON.stringify(profileForAI(el))}
CANDIDATES: ${JSON.stringify(cands)}`;
  try {
    const out = await AI.json(prompt, {modelTier:"default"});
    const ids = new Set(cands.map(c => c.id));
    const picks = (Array.isArray(out) ? out : []).filter(p => p && ids.has(String(p.id))).slice(0,3)
      .map(p => ({id:String(p.id), ja:String(p.reason_ja||"").slice(0,60), en:String(p.reason_en||"").slice(0,120)}));
    if (!picks.length) throw {code:"invalid_json"};
    S.ai[elId] = {picks, at:Date.now()}; save();
    toast(J("AIがおすすめを選び直しました","AI refined the picks"));
  } catch(e){ const m = aiErr(e); if (m) toast(m); }
  finally { delete UI.busy["ai-"+elId]; render(); }
}
function routeLabelEn(el, ev){ if (ev.area === "home") return "from home"; const k = km(el.area, ev.area); return k <= 1 ? `${walkMin(k)} min walk` : `${busMin(k)} min by bus`; }
async function aiScript(elId, evId){
  const el = elder(elId), ev = event(evId); if (!AI || !el || !ev) return;
  const r = scoreEvent(el, ev);
  const key = "sc-"+scriptKey(elId, evId); UI.busy[key] = true; render();
  const prompt = `Write a short phone-call script for a community-events service in Kyoto that calls older residents to invite them to local events. A staff member (or later a voice agent) reads it aloud.
Rules for the Japanese script: polite but friendly です/ます form, short sentences, no jargon or katakana-heavy words, at most 6 sentences. Address the person as "${surname(el)}さん". Introduce yourself as the 「つなぐ」地域案内係. Say what the event is, when and where, the cost, and why it was picked for them. End with one simple yes/no question.
Then give a faithful English translation.
Reply with only JSON: {"ja":"...","en":"..."}

PERSON: ${JSON.stringify(profileForAI(el))}
EVENT: ${JSON.stringify({title_ja:ev.title.ja, title_en:ev.title.en, description_ja:ev.desc.ja, when_ja: ev.when.kind==="flex" ? "いつでも（郵送）" : `${fmtJa(nextDate(ev))} ${ev.when.start}〜${ev.when.end}`, place_ja:ev.place.ja, getting_there:routeLabelEn(el, ev), cost_yen:ev.cost, helping_role:ev.helping, cross_generational:ev.crossGen})}
WHY PICKED: ${JSON.stringify((r ? r.why.slice(0,3) : []).map(w => w.k === "int" ? "likes "+INTERESTS[w.v].en : w.k))}`;
  try {
    const out = await AI.json(prompt, {modelTier:"default"});
    if (!out || typeof out.ja !== "string" || !out.ja.trim()) throw {code:"invalid_json"};
    S.scripts[scriptKey(elId, evId)] = {ja:out.ja.trim(), en:String(out.en||"").trim(), ai:true}; save();
    toast(J("AIが通話台本を作成しました","AI wrote the call script"));
  } catch(e){ const m = aiErr(e); if (m) toast(m); }
  finally { delete UI.busy[key]; render(); }
}
function fmtJa(d){ return d ? `${d.getMonth()+1}月${d.getDate()}日（${DOW_JA[d.getDay()]}）` : ""; }

/* ============ call queue ============ */
function callQueue(){
  const q = [];
  for (const c of S.callReqs){
    if (c.status === "done") continue;
    const el = elder(c.elderId), ev = event(c.eventId); if (!el || !ev) continue;
    q.push({kind:c.by === "elder" ? "asked" : c.by === "staff" ? "weekly" : "family", req:c, el, ev, later:c.status === "later"});
  }
  const week = Date.now() - 7*864e5;
  for (const el of S.elders){
    if (el.stopCalls || el.contact === "app") continue;
    if (q.some(x => x.el.id === el.id)) continue;
    if (S.callLogs.some(l => l.elderId === el.id && l.at > week)) continue;
    const top = picksFor(el, 1)[0]; if (!top) continue;
    q.push({kind:"weekly", req:null, el, ev:top.ev, rec:top});
  }
  const order = {asked:0, family:1, weekly:2};
  return q.sort((a,b) => (!!a.later - !!b.later) || order[a.kind] - order[b.kind]);
}
function prefTime(el){
  const d = el.days.map(x => x === "wkday" ? J("平日","weekdays") : J("週末","weekends")).join(J("・"," & "));
  const t = el.times.map(x => loc(SLOTS[x])).join(J("・",", "));
  return `${d} ${t}`;
}
function recordOutcome(item, outcome){
  const el = item.el, ev = item.ev;
  S.callLogs.unshift({id:uid("l"), elderId:el.id, eventId:ev.id, outcome, at:Date.now(), ai:!!(S.scripts[scriptKey(el.id, ev.id)]||{}).ai});
  const req = item.req || null;
  if (outcome === "interested"){
    if (!hasRsvp(el.id, ev.id)) S.rsvps.push({id:uid("r"), elderId:el.id, eventId:ev.id, via:"phone", at:Date.now()});
    if (req) req.status = "done";
    toast(J(`${el.name.ja}さんの参加を登録しました`, `${el.name.en} is signed up`));
  } else if (outcome === "not_now"){
    el.declined[ev.cat] = (el.declined[ev.cat]||0) + 1;
    if (req) req.status = "done";
    toast(J("記録しました。今後はこの種類を控えめにおすすめします","Logged. This kind of event will be suggested less"));
  } else if (outcome === "later"){
    if (req) req.status = "later";
    else S.callReqs.push({id:uid("c"), elderId:el.id, eventId:ev.id, by:"staff", status:"later", at:Date.now()});
    toast(J("かけ直しリストに入れました","Moved to call-back list"));
  } else if (outcome === "stop"){
    el.stopCalls = true; if (el.contact !== "app") el.contact = "app";
    S.callReqs.forEach(c => { if (c.elderId === el.id) c.status = "done"; });
    toast(J("今後はお電話しません。アプリでのご案内のみになります","Calls stopped. Suggestions will only appear in the app"));
  }
  save();
}

/* ============ moderation ============ */
function scanFlags(o){
  const txt = [o.title, o.desc, o.place, o.audience].join(" ");

/* ============ motion: springs, projection, rubber-banding ============ */
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const isSheet = () => matchMedia("(max-width:560px)").matches;
// Spring described the way Apple does: response (s) and damping ratio (1 = no overshoot).
// It always starts from the current value and velocity, so it can be interrupted at any frame.
function spring(from, to, v0, onUpdate, onDone, {response = .34, damping = 1} = {}){
  const k = (2*Math.PI/response)**2, c = 4*Math.PI*damping/response;
  let x = from, v = v0, last = performance.now(), id = 0, live = true;
  const step = t => {
    if (!live) return;
    let dt = Math.min(.05, (t - last)/1000); last = t;
    while (dt > 0){ const h = Math.min(dt, .004); v += (-k*(x - to) - c*v)*h; x += v*h; dt -= h; }
    if (Math.abs(x - to) < .5 && Math.abs(v) < 8){ onUpdate(to, 0); live = false; onDone && onDone(); return; }
    onUpdate(x, v); id = requestAnimationFrame(step);
  };
  id = requestAnimationFrame(step);
  return () => { live = false; cancelAnimationFrame(id); return v; };
}
const project = (v, d = .99) => (v/1000) * d / (1 - d);              // where a flick would come to rest
const rubberband = (o, dim, c = .55) => (o*dim*c) / (dim + c*Math.abs(o)); // soft resistance past an edge

let toastT;
function toast(msg){
  clearTimeout(toastT);
  $("#layer").querySelector(".toast")?.remove();
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role","status");
  d.innerHTML = ico("check") + `<span>${esc(msg)}</span>`;
  $("#layer").appendChild(d);

/* modal: centered dialog on wide screens, draggable bottom sheet on phones */
const sheet = {y:0, v:0, stop:null};
function setY(m, y){ sheet.y = y; m.style.transform = `translate3d(0,${y}px,0)`; }
function animY(m, from, to, v, done){
  sheet.stop && sheet.stop();
  sheet.stop = spring(from, to, v, (y, vel) => { setY(m, y); sheet.v = vel; }, () => { sheet.stop = null; sheet.v = 0; done && done(); });
}
function modalHTML(){ return UI.modal.kind === "call" ? callModal() : reportModal(); }
function openModal(m){ UI.modal = m; renderModal(); }
function renderModal(){
  if (!UI.modal) return;
  const L = $("#layer");
  let scrim = L.querySelector(".scrim:not(.closing)");
  if (scrim){ scrim.querySelector(".modal-body").innerHTML = modalHTML(); return; }   // update in place, no re-entrance
  scrim = document.createElement("div"); scrim.className = "scrim"; scrim.dataset.act = "scrim";
  scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="grab" title="${J("下にスワイプして閉じる","Swipe down to close")}"><span></span></div><div class="modal-body">${modalHTML()}</div></div>`;
  L.appendChild(scrim);
  const m = scrim.querySelector(".modal");
  UI.lastFocus = document.activeElement;
  if (isSheet() && !reduce()){ const h = m.offsetHeight; setY(m, h); requestAnimationFrame(() => { scrim.classList.add("open"); animY(m, h, 0, 0); }); }
  else requestAnimationFrame(() => scrim.classList.add("open"));
  bindSheet(scrim, m);
  m.querySelector(".modal-body button")?.focus({preventScroll:true});
}
function closeModal(){
  stopSpeak();
  if (!UI.modal) return;
  UI.modal = null;
  const scrim = $("#layer .scrim:not(.closing)"); if (!scrim) return;
  scrim.classList.add("closing"); scrim.classList.remove("open"); scrim.style.removeProperty("--dim");
  const m = scrim.querySelector(".modal"), done = () => scrim.remove();
  if (isSheet() && !reduce()) animY(m, sheet.y, m.offsetHeight + 24, Math.max(sheet.v, 0), done);  // leaves the way it came: down
  else setTimeout(done, reduce() ? 170 : 240);
  try { UI.lastFocus && document.contains(UI.lastFocus) && UI.lastFocus.focus({preventScroll:true}); } catch(e){}
}
function bindSheet(scrim, m){
  const grab = m.querySelector(".grab");
  let startY = 0, base = 0, hist = [], dragging = false;
  grab.addEventListener("pointerdown", e => {
    if (!isSheet() || reduce()) return;
    if (sheet.stop){ sheet.stop(); sheet.stop = null; }       // grab it mid-flight; continue from where it is
    grab.setPointerCapture(e.pointerId);
    dragging = true; startY = e.clientY; base = sheet.y; hist = [{y:e.clientY, t:e.timeStamp}];
    m.classList.add("dragging");
  });
  grab.addEventListener("pointermove", e => {
    if (!dragging) return;
    let y = base + (e.clientY - startY);
    if (y < 0) y = -rubberband(-y, m.offsetHeight);           // resist pulling up past the top
    setY(m, y);
    scrim.style.setProperty("--dim", Math.max(0, 1 - Math.max(0, y) / m.offsetHeight).toFixed(3));
    hist.push({y:e.clientY, t:e.timeStamp}); if (hist.length > 5) hist.shift();
  });
  const end = () => {
    if (!dragging) return; dragging = false; m.classList.remove("dragging");
    const a = hist[0], b = hist[hist.length - 1];
    const v = b.t > a.t ? (b.y - a.y) / ((b.t - a.t) / 1000) : 0;   // px/s at release
    if (sheet.y + project(v) > m.offsetHeight * .45){ sheet.v = v; closeModal(); }
    else { scrim.style.setProperty("--dim", 1); animY(m, sheet.y, 0, v); }  // hand the finger's velocity to the spring
  };
  grab.addEventListener("pointerup", end);
  grab.addEventListener("pointercancel", end);
}

function stopSpeak(){ try { window.speechSynthesis && speechSynthesis.cancel(); } catch(e){} $("#scr")?.classList.remove("speaking"); }
function speak(text){
  const note = $("#tts-note");
  if (!("speechSynthesis" in window)){ if (note) note.textContent = J("このブラウザは読み上げに対応していません。台本を声に出して読んでください。","This browser can't read aloud. Read the script out loud instead."); return; }
  stopSpeak();
  const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; u.rate = .92;
  const v = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang));
  if (v) u.voice = v; else if (note) note.textContent = J("日本語の音声が見つからない場合、別の声で読まれることがあります。","No Japanese voice found in this browser, so it may sound off.");
  u.onend = () => $("#scr")?.classList.remove("speaking");
  $("#scr")?.classList.add("speaking");
  speechSynthesis.speak(u);
}

function regValidate(r){

  if (st === "contact" && (!r.days.length || !r.times.length)) return J("都合の良い日と時間を1つ以上選んでください。","Choose at least one day and one time.");
  if (st === "interests" && !r.interests.length) return J("1つ以上選んでください。","Choose at least one.");
  if (st === "consent" && !r.consent) return J("チェックを入れてください。","Please tick the box to continue.");

function regFinish(r){
  let hid = r.helperId;

    hid = uid("h"); S.helpers.push({id:hid, name:{ja:r.hName.trim(), en:r.hName.trim()}, kind:r.mode === "family" ? "family" : "supporter", relation:{ja:r.relation||"", en:r.relation||""}, wantsCopy:r.wantsCopy});
  }
  const id = uid("el");
  const nm = r.name.trim().replace(/\s+/, " ");
  S.elders.push({id, name:{ja:nm, en:nm}, phone:r.phone.trim(), contact:r.contact, days:r.days, times:r.times, area:r.area, interests:r.interests, travel:r.travel, access:r.access, help:r.help, managedBy:r.mode === "self" ? null : hid, registeredBy:r.mode, declined:{}, stopCalls:false, consentAt:Date.now()});
  save(); UI.reg = null;
  if (r.mode === "self"){ S.actor.elder = id; go("elder"); } else { S.actor.helper = hid; go("family"); }

/* ============ routing & render ============ */
const ROUTES = {home:viewHome, elder:viewElder, family:viewFamily, organizer:viewOrganizer, admin:viewAdmin, register:viewRegister, join:viewJoin};
function route(){ const h = location.hash.replace("#",""); return ROUTES[h] ? h : "home"; }
function go(r){ if (location.hash !== "#"+r) location.hash = r; else render(); }
function render(){
  const r = route();
  S.role = ["elder","family","organizer","admin"].includes(r) ? r : null;
  document.documentElement.lang = S.lang;
  $("#app").innerHTML = header() + `<main><div class="wrap">${ROUTES[r]()}</div></main>` +
    `<footer><div class="wrap"><span>${J("つなぐ 試作版 · 京都AIイノベーションラボ · 表示の人物・団体・催しはすべてサンプルです","Tsunagu prototype · Kyoto AI Innovation Lab · all people, organizers and events shown are samples")}</span>
    <button class="btn btn-sm btn-quiet" data-act="reset">${UI.resetArm ? J("もう一度押すとリセット","Tap again to reset") : J("デモデータをリセット","Reset demo data")}</button></div></footer>`;
  renderModal();
  UI.stepDir = UI.justAdded = UI.justReq = null;   // one-shot motion cues are spent once drawn

window.addEventListener("hashchange", () => { window.scrollTo(0,0); render(); });
const markScroll = () => { const s = window.scrollY > 4; if (s !== ("scrolled" in document.body.dataset)) { if (s) document.body.dataset.scrolled = ""; else delete document.body.dataset.scrolled; } };
window.addEventListener("scroll", markScroll, {passive:true});

/* ============ bindings ============ */
function setPath(path, val){ const [o,k] = path.split("."); if (UI[o]) UI[o][k] = val; }
document.addEventListener("input", e => { const b = e.target.dataset && e.target.dataset.bind; if (b) setPath(b, e.target.value); });
document.addEventListener("change", e => {
  const t = e.target, b = t.dataset && t.dataset.bind;
  if (b){ setPath(b, t.value); if (t.dataset.rerender) render(); }
});
document.addEventListener("submit", e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === "event") submitEvent();
  if (f === "org") submitOrg();
});
function submitEvent(){
  const o = org(S.actor.org), f = UI.ef;
  f.err = "";
  if (!f.title.trim() || !f.place.trim() || !f.start) f.err = J("名前・会場・開始時刻を入力してください。","Please fill in the title, venue and start time.");
  else if (f.kind === "once" && parseYmd(f.date) < today0()) f.err = J("日付は今日以降にしてください。","Pick a date from today onwards.");
  else if (o.type === "individual" && weekCount(o.id) >= 3) f.err = J("個人の主催者は1週間に3件まで掲載できます。","Individual organizers can post up to 3 events a week.");
  if (f.err) return render();
  const flags = scanFlags(f);
  const indiv = o.type === "individual" || o.status === "pending";
  const status = (indiv || flags.length) ? "pending" : "published";
  const when = f.kind === "once" ? {kind:"once", date:f.date, start:f.start, end:f.end} : f.kind === "weekly" ? {kind:"weekly", dow:+f.dow, start:f.start, end:f.end} : {kind:"monthly", nth:+f.nth, dow:+f.dow, start:f.start, end:f.end};
  const same = s => ({ja:s, en:s});
  const bi = k => (f.ex && f.ex[k] && Object.values(f.ex[k]).includes(f[k])) ? f.ex[k] : same(f[k].trim());
  S.events.push({id:uid("e"), orgId:o.id, cat:f.cat, tags:Array.from(new Set([f.cat, ...f.tags])), title:bi("title"), desc:bi("desc"), when, place:bi("place"), area:f.area, access:f.access, cost:Math.max(0, +f.cost||0), capacity:Math.max(1, +f.capacity||1), audience:bi("audience"), helping:f.helping, crossGen:f.crossGen, firstTimer:f.firstTimer, status, flags, createdAt:Date.now()});
  if (status === "published") S.ai = {};
  save(); UI.ef = null; UI.orgTab = "events";
  toast(status === "published" ? J("掲載しました。条件に合う方のおすすめに表示されます","Published. It will now show for people it suits") : flags.length ? J("自動チェックで確認が必要になりました。運営が確認します","Held by the auto-check for a staff review") : J("審査に出しました","Submitted for review"));
  render();
}
function submitOrg(){
  const f = UI.of; f.err = "";
  if (!f.name.trim() || !f.contact.trim()) { f.err = J("名前と連絡先を入力してください。","Please enter a name and contact."); return render(); }
  const id = uid("o");
  S.orgs.push({id, name:{ja:f.name.trim(), en:f.name.trim()}, type:f.type, status:"pending", contact:f.contact.trim(), bio:{ja:f.bio.trim(), en:f.bio.trim()}});
  S.actor.org = id; save(); UI.of = null; UI.orgTab = "new";
  toast(J("登録しました。確認をお待ちください","Signed up. Staff will review your account"));
  go("organizer");
}

  "go-role": d => {
    if (d.r === "elder") S.actor.elder = $("#pick-el").value;
    if (d.r === "family") S.actor.helper = $("#pick-h").value;
    if (d.r === "organizer"){ S.actor.org = $("#pick-o").value; UI.orgTab = "events"; UI.ef = null; }
    save(); go(d.r);
  },
  "demo-post": () => { S.actor.org = "o2"; UI.orgTab = "new"; UI.ef = blankEF(); ACT["ef-example"](); save(); go("organizer"); },
  "demo-elder": () => { S.actor.elder = "el1"; save(); go("elder"); },
  "demo-admin": () => { UI.adminTab = "calls"; go("admin"); },
  "demo-org": () => { S.actor.org = "o2"; UI.orgTab = "events"; save(); go("organizer"); },
  "reg-start": (d, el, e) => { e.preventDefault(); UI.reg = newReg(d.mode, d.helper); go("register"); },
  "reg-set": d => { const r = UI.reg; r[d.f] = d.v === "true" ? true : d.v === "false" ? false : d.v; r.err = ""; render(); },
  "reg-toggle": d => { const a = UI.reg[d.f]; const i = a.indexOf(d.v); i >= 0 ? a.splice(i,1) : a.push(d.v); UI.reg.err = ""; render(); },
  "reg-consent": (d, el) => { UI.reg.consent = el.checked; UI.reg.err = ""; },
  "reg-back": () => { UI.reg.step--; UI.reg.err = ""; UI.stepDir = "back"; render(); window.scrollTo(0,0); },
  "reg-next": () => { const r = UI.reg; r.err = regValidate(r); if (r.err) return render();
    if (r.step === regSteps(r).length - 1) return regFinish(r);
    r.step++; UI.stepDir = "next"; render(); window.scrollTo(0,0); $(".wiz .inp")?.focus({preventScroll:true}); },
  rsvp: (d, b) => { const el = S.actor.elder;
    const commit = () => {
      if (!hasRsvp(el, d.ev)){ const r = {id:uid("r"), elderId:el, eventId:d.ev, via:"app", at:Date.now()}; S.rsvps.push(r); UI.justAdded = r.id; }
      S.callReqs.forEach(c => { if (c.elderId === el && c.eventId === d.ev) c.status = "done"; });
      save(); toast(J("申し込みました。「参加予定」に入りました","You're signed up. See “My upcoming events”")); render(); };
    const card = b.closest(".ecard");
    if (card && !card.classList.contains("leaving")){ card.classList.add("leaving"); setTimeout(commit, reduce() ? 120 : 240); } else if (!card) commit(); },
  "call-me": d => { const el = S.actor.elder; if (!openReq(el, d.ev)){ const c = {id:uid("c"), elderId:el, eventId:d.ev, by:"elder", status:"open", at:Date.now()}; S.callReqs.push(c); UI.justReq = c.id; }
    save(); toast(J("ご都合の良い時間にお電話します","We'll call you at a time that suits you")); render(); },
  "cancel-rsvp": d => { S.rsvps = S.rsvps.filter(r => r.id !== d.id); save(); toast(J("取り消しました","Cancelled")); render(); },
  report: d => openModal({kind:"report", eventId:d.ev, reason:null}),
  "report-pick": d => { UI.modal.reason = d.k; renderModal(); },
  "report-send": () => { S.reports.push({id:uid("p"), eventId:UI.modal.eventId, reason:UI.modal.reason, status:"open", at:Date.now()}); save(); closeModal(); toast(J("報告を受け付けました。運営が確認します","Report sent. Staff will look into it")); render(); },
  close: () => closeModal(),
  scrim: (d, el, e) => { if (e.target === el) closeModal(); },
  "send-phone": d => { if (!openReq(d.el, d.ev)) S.callReqs.push({id:uid("c"), elderId:d.el, eventId:d.ev, by:"relative", status:"open", at:Date.now()}); save(); toast(J("電話でお伝えするよう、キューに入れました","Added to the call queue")); render(); },
  "ai-rec": d => aiRecommend(d.id),
  edit: d => { const el = elder(d.id); UI.editing = {id:el.id, contact:el.contact, stopCalls:el.stopCalls, interests:[...el.interests]}; render(); },
  "ed-contact": d => { UI.editing.contact = d.v; render(); },
  "ed-stop": (d, el) => { UI.editing.stopCalls = el.checked; },
  "ed-int": d => { const a = UI.editing.interests, i = a.indexOf(d.k); i >= 0 ? a.splice(i,1) : a.push(d.k); render(); },
  "ed-save": () => { const ed = UI.editing, el = elder(ed.id); if (!ed.interests.length) return toast(J("興味を1つ以上選んでください","Choose at least one interest"));
    el.contact = ed.contact; el.stopCalls = ed.stopCalls; el.interests = ed.interests; delete S.ai[el.id]; UI.editing = null; save(); toast(J("保存しました","Saved")); render(); },
  "ed-cancel": () => { UI.editing = null; render(); },
  "org-tab": d => { UI.orgTab = d.t; render(); },
  "ef-tag": d => { const a = UI.ef.tags, i = a.indexOf(d.k); i >= 0 ? a.splice(i,1) : a.push(d.k); render(); },
  "ef-access": (d, el) => { const a = UI.ef.access, i = a.indexOf(d.k); el.checked ? (i < 0 && a.push(d.k)) : (i >= 0 && a.splice(i,1)); },
  "ef-flag": (d, el) => { UI.ef[d.k] = el.checked; },
  "ef-reset": () => { UI.ef = blankEF(); render(); },
  "ef-example": () => {
    const ex = {title:{ja:"組紐づくり 多世代ワークショップ",en:"Kumihimo braiding: a cross-generational workshop"},
      desc:{ja:"大学生と一緒に、組紐でストラップを作ります。得意な方は学生に教えてください。道具は用意します。",en:"Make a braided-cord strap with university students. If you know the craft, help teach them. Tools provided."},
      place:{ja:"西陣ふれあいサロン",en:"Nishijin Community Salon"}, audience:{ja:"どなたでも。初めての方歓迎",en:"Anyone; beginners welcome"}};
    UI.ef = {...blankEF(), ex, title:loc(ex.title), desc:loc(ex.desc), place:loc(ex.place), audience:loc(ex.audience),
      cat:"crafts", tags:["crafts","young","teaching"], kind:"weekly", dow:3, start:"13:30", end:"15:00", area:"nishijin", access:["stepfree","seating"], cost:300, capacity:16,
      helping:true, crossGen:true, firstTimer:true}; render(); },
  "of-type": d => { UI.of.type = d.v; render(); },
  "admin-tab": d => { UI.adminTab = d.t; render(); },
  "sim-call": d => { const it = callQueue()[+d.i]; if (it) openModal({kind:"call", item:it}); },
  speak: () => { const it = UI.modal.item; speak(getScript(it.el.id, it.ev.id).ja); },
  hush: () => stopSpeak(),
  "ai-script": async d => { await aiScript(d.el, d.ev); if (UI.modal) renderModal(); },
  outcome: d => { const it = UI.modal.item; recordOutcome(it, d.o); closeModal(); render(); },
  "org-approve": d => { org(d.id).status = org(d.id).type === "official" ? "verified" : "approved"; save(); toast(J("承認しました","Approved")); render(); },
  "org-reject": d => { org(d.id).status = "rejected"; save(); toast(J("却下しました","Rejected")); render(); },
  "ev-approve": d => { const ev = event(d.id); ev.status = "published"; ev.flags = []; S.ai = {}; save(); toast(J("公開しました","Published")); render(); },
  "ev-reject": d => { event(d.id).status = "rejected"; save(); toast(J("却下しました","Rejected")); render(); },
  "rep-dismiss": d => { S.reports.find(p => p.id === d.id).status = "dismissed"; save(); render(); },
  "rep-unpublish": d => { const p = S.reports.find(p => p.id === d.id); p.status = "actioned"; event(p.eventId).status = "rejected"; save(); toast(J("非公開にしました","Event unpublished")); render(); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.tagName === "INPUT") { fn(b.dataset, b, e); return; }
  if (b.dataset.act !== "scrim" && b.dataset.act !== "reg-start") e.preventDefault();
  fn(b.dataset, b, e);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.modal) closeModal(); });

render();
(async () => {
  try { AI = (window.claude && window.claude.use) ? await window.claude.use("sample") : null; } catch(e){ AI = null; }
  if (AI) render();
})();
if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); } catch(e){} }
</script>

</body>
</html>
